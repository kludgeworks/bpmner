<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>bpmner — Generation Studio</title>
		<link rel="stylesheet" href="fonts.css">
		<link rel="stylesheet" href="style.css">
		<link rel="stylesheet" href="bpmn-js.css">
		<link rel="stylesheet" href="diagram-js.css">
		<link rel="stylesheet" href="bpmn-font/css/bpmn.css">
	</head>

	<body>
		<div class="studio">
			<header class="studio-bar">
				<h1 class="studio-brand">bpmner</h1>
				<span
					id="version-footer"
					class="studio-version"
					aria-label="Application version"
				></span>
				<p class="studio-tagline">Generation Studio</p>
			</header>

			<aside class="studio-sidebar" aria-label="Controls and status">
				<section class="panel">
					<h2 class="panel-title">Describe</h2>
					<label class="visually-hidden" for="process-description"
						>Process description</label
					>
					<textarea
						id="process-description"
						rows="8"
						placeholder="Enter process description…"
					></textarea>
					<button id="generate-btn" type="button" class="btn-primary">
						Generate
					</button>
				</section>

				<div id="clarify-region" class="hidden"></div>

				<section class="panel">
					<h2 class="panel-title">Pipeline</h2>
					<ol id="stage-rail" aria-label="Pipeline stages">
						<li data-stage="readiness" data-state="pending">Readiness</li>
						<li data-stage="contract" data-state="pending">Contract</li>
						<li data-stage="generate" data-state="pending">Generate</li>
						<li data-stage="validate" data-state="pending">Validate</li>
						<li data-stage="layout" data-state="pending">Layout</li>
						<li data-stage="align" data-state="pending">Align</li>
					</ol>
				</section>

				<div id="progress-container" class="panel hidden">
					<h2 class="panel-title">Progress</h2>
					<ul id="progress-list"></ul>
				</div>

				<div id="result-bar" class="hidden"></div>
			</aside>

			<main class="studio-canvas" aria-label="Diagram canvas">
				<div id="canvas"></div>
				<div id="canvas-status" class="canvas-status hidden"></div>
				<div class="io-zoom-controls">
					<ul
						class="io-zoom-reset io-control io-control-list"
						aria-label="Diagram zoom controls"
					>
						<li>
							<button
								id="zoom-reset-btn"
								type="button"
								title="Reset zoom"
								aria-label="Reset zoom"
							>
								<svg
									viewBox="0 0 24 24"
									width="14"
									height="14"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
									aria-hidden="true"
								>
									<path d="M8 3H5a2 2 0 0 0-2 2v3" />
									<path d="M16 3h3a2 2 0 0 1 2 2v3" />
									<path d="M8 21H5a2 2 0 0 1-2-2v-3" />
									<path d="M16 21h3a2 2 0 0 0 2-2v-3" />
								</svg>
							</button>
						</li>
						<li><hr></li>
						<li>
							<button
								id="zoom-in-btn"
								type="button"
								title="Zoom in"
								aria-label="Zoom in"
							>
								<svg
									viewBox="0 0 24 24"
									width="14"
									height="14"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									aria-hidden="true"
								>
									<path d="M12 5v14M5 12h14" />
								</svg>
							</button>
						</li>
						<li><hr></li>
						<li>
							<button
								id="zoom-out-btn"
								type="button"
								title="Zoom out"
								aria-label="Zoom out"
							>
								<svg
									viewBox="0 0 24 24"
									width="14"
									height="14"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									aria-hidden="true"
								>
									<path d="M5 12h14" />
								</svg>
							</button>
						</li>
					</ul>
				</div>
				<div class="io-import-export">
					<ul
						class="io-export io-control io-control-list io-horizontal"
						aria-label="Diagram export actions"
					>
						<li>
							<button
								id="download-diagram-btn"
								type="button"
								aria-disabled="true"
								title="Download as BPMN 2.0 file"
								aria-label="Download as BPMN 2.0 file"
							>
								<svg
									viewBox="0 0 24 24"
									width="14"
									height="14"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
									aria-hidden="true"
								>
									<path d="M12 3v12" />
									<path d="M7 10l5 5 5-5" />
									<path d="M4 19h16" />
								</svg>
							</button>
						</li>
						<li>
							<button
								id="download-svg-btn"
								type="button"
								aria-disabled="true"
								title="Download as SVG image"
								aria-label="Download as SVG image"
							>
								<svg
									viewBox="0 0 24 24"
									width="14"
									height="14"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
									aria-hidden="true"
								>
									<rect x="3" y="3" width="18" height="18" rx="2" />
									<circle cx="8.5" cy="8.5" r="1.5" />
									<path d="M21 15l-5-5L5 21" />
								</svg>
							</button>
						</li>
					</ul>
				</div>
			</main>
		</div>
		<script src="js/app-bundle.js"></script>
	</body>
</html>
