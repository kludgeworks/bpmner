<html lang="en">
	<head>
		<base href="/">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>bpmner — Generation Studio</title>
		<link rel="stylesheet" href="fonts.css">
		<link rel="stylesheet" href="style.css">
		<link rel="stylesheet" href="bpmn-js.css">
		<link rel="stylesheet" href="diagram-js.css">
		<link rel="stylesheet" href="bpmn-font/css/bpmn.css">
	</head>

	<body>
		<div class="studio">
			<header class="studio-bar">
				<h1 class="studio-brand">bpmner</h1>
				<span class="studio-tagline">Generation Studio</span>
				<p class="studio-version">
					<span class="visually-hidden">Application version</span>
					<span id="version-footer"></span>
				</p>
			</header>

			<!--
				One announcement channel for the whole studio. Written only when the text
				changes, so the per-second elapsed readouts are never narrated.
			-->
			<p
				id="sr-status"
				class="visually-hidden"
				role="status"
				aria-live="polite"
			></p>

			<main class="studio-main">
				<!-- 01 · Compose ------------------------------------------------------- -->
				<section
					id="view-compose"
					class="view view-compose"
					aria-label="Describe the process"
				>
					<section class="compose-card">
						<p class="tag">01 / Describe</p>
						<h2 class="compose-title">What process should I draw?</h2>
						<label class="visually-hidden" for="process-description"
							>Process description</label
						>
						<div class="compose-field">
							<textarea
								id="process-description"
								rows="7"
								maxlength="10000"
								placeholder="Describe the process in plain language — who does what, in what order, and where the decisions are."
							></textarea>
							<span id="compose-count" class="compose-count" aria-live="off"
								>0 / 10 000</span
							>
						</div>
						<p id="compose-error" class="compose-error" role="alert"></p>
						<div class="compose-actions">
							<button id="generate-btn" type="button" class="btn-primary">
								Generate diagram
							</button>
						</div>
					</section>
				</section>

				<!-- 02 · Run ----------------------------------------------------------- -->
				<section
					id="view-run"
					class="view view-run"
					hidden
					aria-label="Generation progress"
				>
					<header class="run-head">
						<div class="run-head-desc">
							<p class="tag">02 / Generating</p>
							<p id="run-desc" class="run-desc"></p>
						</div>
						<div class="run-head-clock">
							<p id="run-clock" class="run-clock" aria-live="off">0:00</p>
							<p class="tag">Elapsed</p>
						</div>
					</header>

					<div id="stream-banner" class="stream-banner" role="status" hidden>
						<span id="stream-banner-text"></span>
					</div>

					<div class="run-body">
						<section class="run-pipeline" aria-label="Pipeline">
							<div id="now-running" class="now-running"></div>
							<div id="clarify-region" hidden></div>
							<ol id="pipeline" class="pipeline"></ol>
						</section>

						<section class="run-telemetry" aria-label="Run telemetry">
							<header class="telemetry-head">
								<p class="tag">Run telemetry</p>
								<p id="telemetry-state" class="telemetry-state">
									<span
										class="telemetry-dot"
										aria-hidden="true"
									></span>Streaming
								</p>
							</header>
							<ol id="telemetry-log" class="telemetry-log"></ol>
						</section>
					</div>
				</section>

				<!-- 03 · Result -------------------------------------------------------- -->
				<section
					id="view-result"
					class="view view-result"
					hidden
					aria-label="Generated diagram"
				>
					<header class="result-head">
						<div class="result-head-title">
							<p class="tag">03 / Result</p>
							<p id="result-badge" class="result-badge"></p>
							<p id="result-headline" class="result-headline"></p>
						</div>
						<div class="result-head-actions">
							<p id="result-meta" class="result-meta"></p>
							<button id="new-run-btn" type="button" class="btn-outline">
								New run
							</button>
						</div>
					</header>

					<div class="result-body">
						<div class="canvas-region">
							<div id="canvas"></div>
							<div id="canvas-status" class="canvas-status" hidden></div>
							<div id="empty-result" class="empty-result" hidden>
								<p class="tag">Nothing to render</p>
								<p id="empty-title" class="empty-title"></p>
								<p id="empty-why" class="empty-why"></p>
								<button id="empty-back" type="button" class="btn-primary">
									Back to your description
								</button>
							</div>
							<div class="io-zoom-controls">
								<ul
									class="io-zoom-reset io-control io-control-list"
									aria-label="Diagram zoom controls"
								>
									<li>
										<button
											id="zoom-reset-btn"
											type="button"
											title="Reset zoom"
											aria-label="Reset zoom"
										>
											<svg
												viewBox="0 0 24 24"
												width="14"
												height="14"
												fill="none"
												stroke="currentColor"
												stroke-width="2"
												stroke-linecap="round"
												stroke-linejoin="round"
												aria-hidden="true"
											>
												<path d="M8 3H5a2 2 0 0 0-2 2v3" />
												<path d="M16 3h3a2 2 0 0 1 2 2v3" />
												<path d="M8 21H5a2 2 0 0 1-2-2v-3" />
												<path d="M16 21h3a2 2 0 0 0 2-2v-3" />
											</svg>
										</button>
									</li>
									<li><hr></li>
									<li>
										<button
											id="zoom-in-btn"
											type="button"
											title="Zoom in"
											aria-label="Zoom in"
										>
											<svg
												viewBox="0 0 24 24"
												width="14"
												height="14"
												fill="none"
												stroke="currentColor"
												stroke-width="2"
												stroke-linecap="round"
												aria-hidden="true"
											>
												<path d="M12 5v14M5 12h14" />
											</svg>
										</button>
									</li>
									<li><hr></li>
									<li>
										<button
											id="zoom-out-btn"
											type="button"
											title="Zoom out"
											aria-label="Zoom out"
										>
											<svg
												viewBox="0 0 24 24"
												width="14"
												height="14"
												fill="none"
												stroke="currentColor"
												stroke-width="2"
												stroke-linecap="round"
												aria-hidden="true"
											>
												<path d="M5 12h14" />
											</svg>
										</button>
									</li>
								</ul>
							</div>
						</div>

						<aside
							id="summary-panel"
							class="summary-panel"
							aria-label="Run summary"
						>
							<button
								id="summary-toggle"
								type="button"
								class="summary-toggle"
								aria-expanded="true"
								aria-controls="result-sections"
								title="Collapse run summary"
							>
								<span class="visually-hidden">Run summary</span>
								<span class="summary-chev" aria-hidden="true">›</span>
							</button>
							<section class="summary-section">
								<h3 class="summary-title">Export</h3>
								<div class="summary-exports">
									<button
										id="download-diagram-btn"
										type="button"
										class="btn-outline"
										aria-disabled="true"
									>
										BPMN 2.0 XML
									</button>
									<button
										id="download-svg-btn"
										type="button"
										class="btn-outline"
										aria-disabled="true"
									>
										SVG
									</button>
								</div>
							</section>
							<div id="result-sections" class="summary-sections"></div>
						</aside>
					</div>
				</section>
			</main>
		</div>
		<script src="js/app-bundle.js"></script>
	</body>
</html>
