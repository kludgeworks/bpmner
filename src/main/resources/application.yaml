spring:
  application:
    name: bpmner
  main:
    web-application-type: none
  jackson:
    use-jackson2-defaults: true

embabel:
  models:
    llms:
      generator: gpt-4.1
      repair-label: gpt-4.1-nano
      repair-patch: gpt-4.1-mini
      repair-rewrite: gpt-4.1
      repairer: gpt-4.1-mini
  agent:
    shell:
      web-application-type: none
      interactive:
        enabled: true
        history-enabled: true
    platform:
      observability:
        enabled: true
        capture-message-content: false

management:
  # Boot 4 enables liveness/readiness health groups for web deployments; preserve prior exposure.
  endpoint:
    health:
      probes:
        enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 0.1

bpmner:
  logging:
    dir: ${BPMNER_LOG_DIR:${LOG_DIR:${BUILD_WORKING_DIRECTORY:${user.dir}}/logs}}
    # Default off. Override via env (`BPMNER_LOGGING_DUMP_ARTIFACTS=true`) or a dev/diagnostic
    # profile when investigating a failing run — intermediate XML is verbose at production scale.
    dump-artifacts: ${BPMNER_LOGGING_DUMP_ARTIFACTS:false}
    # Includes user prose, full prompts, and structured LLM responses. Opt in only for local
    # diagnostics because process descriptions and model messages may contain sensitive data.
    llm-interactions: ${BPMNER_LOGGING_LLM_INTERACTIONS:false}
    # Console (stdout) threshold — independent of the file appender and of per-logger levels
    # (dev.groknull.bpmner/Embabel are DEBUG by default regardless of this setting). Deployments
    # without a mounted log volume have no other way to see DEBUG: `kubectl logs` only ever shows
    # stdout. Override with `BPMNER_LOGGING_CONSOLE_LEVEL=DEBUG` to make it visible there too.
    console-level: ${BPMNER_LOGGING_CONSOLE_LEVEL:INFO}
  # Rule profile and per-rule severity overrides are now sourced from bpmner.pkl (via
  # BpmnerLintConfig). To override the conventions source, set bpmner.rules.config-uri to a
  # file: URI pointing at a local bpmner.pkl that amends the packaged BpmnerLintConfig.pkl.
